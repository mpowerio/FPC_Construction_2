name: Site release check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site-release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generated pages are fresh
        run: node tools/site/build.mjs --check
      - name: Phone copy names JJ (guards the 2026-11-13 merge revert)
        run: node --test tools/site/jj-copy.test.mjs
      - name: GC pages stay unpublished until license day
        run: node --test tools/site/gc.test.mjs
      - name: Bilingual SMS policies
        run: node --test tools/site/policies.test.mjs
      - name: Prove release guard rejects planted placeholders
        run: node --test tools/site/release-policy.test.mjs
      - name: Must-fail controls through the actual SEO command
        run: node tools/site/release-controls.mjs
      - name: SEO and release policy (pending copy blocks release)
        run: node tools/seo-check.mjs
      - name: Spanish copy has had its native-speaker read (red until the read clears PENDING-ES)
        run: node --test tools/site/spanish-read.test.mjs
