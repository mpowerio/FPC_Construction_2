name: Site release check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site-release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check-script dependencies (parse5 + Playwright, pinned; nothing ships to visitors)
        run: npm ci --no-audit --no-fund
      - name: Headless Chromium for the rendered license-line check
        run: npx playwright install --with-deps chromium
      - name: License line is rendered, in the footer and visible on every page (with must-fail controls)
        run: node tools/site/license-visible.browser.mjs
      - name: Claim guard tests (parser, positive structure)
        run: node --test tools/site/claim-guard.test.mjs tools/site/license.test.mjs
      - name: Generated pages are fresh
        run: node tools/site/build.mjs --check
      - name: GitHub Pages publishes only public paths (every tracked file is public or excluded in _config.yml)
        run: node --test tools/site/pages-publish.test.mjs
      - name: Phone copy names JJ (guards the 2026-11-13 merge revert)
        run: node --test tools/site/jj-copy.test.mjs
      - name: GC pages stay unpublished until license day
        run: node --test tools/site/gc.test.mjs
      - name: Bilingual SMS policies
        run: node --test tools/site/policies.test.mjs
      - name: Prove release guard rejects planted placeholders
        run: node --test tools/site/release-policy.test.mjs
      - name: Must-fail controls through the actual SEO command
        run: node tools/site/release-controls.mjs
      - name: SEO and release policy (pending copy blocks release)
        run: node tools/seo-check.mjs
