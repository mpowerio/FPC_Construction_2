name: Site release check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site-release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generated pages are fresh
        run: node tools/site/build.mjs --check
      - name: Prove release guard rejects planted placeholders
        run: node --test tools/site/release-policy.test.mjs
      - name: Must-fail controls through the actual SEO command
        run: node tools/site/release-controls.mjs
      - name: SEO and release policy (pending copy blocks release)
        run: node tools/seo-check.mjs
